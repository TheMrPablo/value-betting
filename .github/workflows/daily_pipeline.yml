name: Daily Pipeline

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: betting-db
          path: data/
        continue-on-error: true

      - name: Initialize DB if not exists
        run: |
          if [ ! -f data/betting.db ]; then
            echo "DB no encontrada — inicializando desde cero..."
            python scripts/init_db.py
          fi
        env:
          PYTHONPATH: .

      - name: Download historical CSVs
        run: |
          mkdir -p data/historical
          # Temporadas históricas (IPs de GitHub no están bloqueadas)
          for season in 2122 2223 2324 2425 2526; do
            for code in D2; do
              file="data/historical/${code}_${season}.csv"
              if [ ! -f "$file" ] || [ "$season" = "2526" ]; then
                echo "Descargando ${code}_${season}.csv..."
                curl -sL "https://www.football-data.co.uk/mmz4281/${season}/${code}.csv" \
                  -o "$file" || echo "No disponible: ${season}"
              fi
            done
          done

      - name: Load historical data to DB
        run: python scripts/load_historical.py --no-download
        env:
          PYTHONPATH: .

      - name: Build features
        run: python src/features/feature_builder.py --league BL2
        env:
          PYTHONPATH: .

      - name: Train DC model
        run: |
          python src/models/dixon_coles.py \
            --league BL2 \
            --db data/betting.db \
            --seasons 2022-23 2023-24 2024-25 2025-26 \
            --model models/dc_params_BL2.pkl \
            --hours 720
        env:
          PYTHONPATH: .

      - name: Train XGBoost model
        run: python src/models/xgboost_model.py --league BL2
        env:
          PYTHONPATH: .

      - name: Scrape odds from Betplay
        run: python src/ingestion/odds_scraper.py --league BL2
        env:
          PYTHONPATH: .

      - name: Run value engine
        run: python src/engine/value_engine.py --league BL2 --hours 720
        env:
          PYTHONPATH: .

      - name: Agent analysis and send signals
        run: |
          python src/output/betting_agent.py --analyze
          python src/output/telegram_bot.py --send
        env:
          PYTHONPATH: .
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: betting-db
          path: data/betting.db
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          python -c "
          import httpx, os
          token = os.environ.get('TELEGRAM_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          if token and chat_id:
              httpx.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  json={'chat_id': chat_id, 'text': '⚠️ Pipeline diario falló. Revisar GitHub Actions.'}
              )
          "
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
