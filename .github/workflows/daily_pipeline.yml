name: Daily Pipeline

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

# Solo un pipeline corre a la vez. Si daily_pipeline está corriendo,
# prematch_scan espera (o se cancela). Evita análisis duplicados del agente.
concurrency:
  group: betting-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: betting-db
          path: data/
        continue-on-error: true

      - name: Initialize / migrate DB
        run: python scripts/init_db.py
        env:
          PYTHONPATH: .

      - name: Download historical CSVs
        run: |
          mkdir -p data/historical
          # Temporadas históricas (IPs de GitHub no están bloqueadas)
          for season in 2122 2223 2324 2425 2526; do
            for code in D2; do
              file="data/historical/${code}_${season}.csv"
              if [ ! -f "$file" ] || [ "$season" = "2526" ]; then
                echo "Descargando ${code}_${season}.csv..."
                curl -sL "https://www.football-data.co.uk/mmz4281/${season}/${code}.csv" \
                  -o "$file" || echo "No disponible: ${season}"
              fi
            done
          done

      - name: Load historical data to DB
        run: python scripts/load_historical.py --no-download
        env:
          PYTHONPATH: .

      - name: Fetch player stats (FBref)
        run: python src/ingestion/player_stats.py --league BL2 --season 2024-25
        env:
          PYTHONPATH: .
        continue-on-error: true   # FBref puede estar caído; el pipeline sigue sin stats

      - name: Build features
        run: python src/features/feature_builder.py --league BL2
        env:
          PYTHONPATH: .

      - name: Train DC model
        run: |
          python src/models/dixon_coles.py \
            --league BL2 \
            --db data/betting.db \
            --seasons 2022-23 2023-24 2024-25 2025-26 \
            --model models/dc_params_BL2.pkl \
            --hours 168
        env:
          PYTHONPATH: .

      - name: Train XGBoost model
        run: python src/models/xgboost_model.py --league BL2
        env:
          PYTHONPATH: .

      - name: Scrape odds from Betplay
        run: python src/ingestion/odds_scraper.py --league BL2
        env:
          PYTHONPATH: .

      - name: Run value engine
        run: python src/engine/value_engine.py --league BL2 --hours 168
        env:
          PYTHONPATH: .

      - name: Agent analysis and send signals
        run: |
          # USE_AGENT=true  → el agente analiza y puede descartar señales antes de enviar
          # USE_AGENT=false → las señales pasan directo al bot (sin filtro del agente)
          # Para cambiar: GitHub → Settings → Variables → USE_AGENT
          if [ "${USE_AGENT:-true}" = "true" ] && [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "🤖 Modo CON agente"
            python src/output/betting_agent.py --analyze --db data/betting.db \
              || echo "⚠️ Agente falló — enviando señales sin filtrar"
          else
            echo "🚫 Modo SIN agente (USE_AGENT=${USE_AGENT:-true})"
          fi
          python src/output/telegram_bot.py --send
        env:
          PYTHONPATH: .
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_AGENT: ${{ vars.USE_AGENT || 'true' }}

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: betting-db
          path: data/betting.db
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          python -c "
          import httpx, os
          token = os.environ.get('TELEGRAM_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          if token and chat_id:
              httpx.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  json={'chat_id': chat_id, 'text': '⚠️ Pipeline diario falló. Revisar GitHub Actions.'}
              )
          "
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
